title: Encoded PowerShell Command Execution
id: 3a7d1f88-2c4b-4e91-bf30-encodedpowershell1059
status: experimental
description: Detects powershell.exe executed with an encoded command (-EncodedCommand
  or any abbreviation) followed by a base64 blob, a common obfuscation technique.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Beck
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\powershell.exe'
  selection_enc:
    CommandLine|re: '(?i)\s-e[a-z]*\s+[A-Za-z0-9+/=]{15,}'
  condition: selection_img and selection_enc
fields:
  - ParentImage
  - CommandLine
falsepositives:
  - Rare legitimate admin scripts that use encoded commands
level: high
tags:
  - attack.execution
  - attack.t1059.001